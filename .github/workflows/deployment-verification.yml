name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Findings surface in the Security tab for triage; they don't block CI.
    continue-on-error: true
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: cs2-server
            env_var: CS2_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" cs2-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  check-pin-freshness:
    name: Check pinned images for upstream drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Scheduled + manual dispatch only: a new upstream release is not
    # actionable inside an unrelated PR. On the cron the failure lands as a
    # workflow-failure notification to the maintainer — a stale pin must
    # not sit unnoticed. Dependabot cannot see these pins (they are compose
    # interpolation defaults, not Dockerfile literals), so this job is the
    # actual tracking mechanism.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare pinned digests against what each tag resolves to now
        run: |
          status=0
          for var in CS2_SERVER_IMAGE_TAG; do
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" cs2-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            # An absent variable used to fall through to the registry lookup
            # and surface as "did not resolve", which reads as an upstream
            # problem. It is a problem in this file: say so.
            if [ -z "$pin" ]; then
              echo "::error::${var} is not present in cs2-server-docker-compose.yml — this job is checking a pin that does not exist"
              status=1
              continue
            fi
            ref="${pin%%@*}"
            pinned_digest="${pin##*@}"
            # Three attempts: an unanswered registry lookup used to leave this empty,
            # and the comparison below then reported it as drift.
            current_digest=""
            for attempt in 1 2 3; do
              current_digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty')"
              [ -n "$current_digest" ] && break
              sleep $(( attempt * 5 ))
            done
            if [ -z "$current_digest" ]; then
              echo "::error::${ref} did not resolve after three attempts: the registry did not answer, or the tag is gone. The pin itself is unchanged."
              status=1
              continue
            fi
            if [ "$pinned_digest" != "$current_digest" ]; then
              echo "::error::${var} digest drift: pinned ${pinned_digest}, but ${ref} now resolves to ${current_digest}"
              status=1
            else
              echo "${var} OK (${ref})"
            fi
          done
          exit "$status"

      - name: Compare the pinned version against the latest upstream release
        # Runs even when the digest comparison above failed, so one run
        # reports every problem it can see instead of one per day.
        if: always()
        run: |
          status=0
          check() {
            var="$1"; gh_repo="$2"
            pin="$(grep -m1 -oE "\\\$\\{${var}:-.*" cs2-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
            if [ -z "$pin" ]; then
              echo "::error::${var} is not present in cs2-server-docker-compose.yml — this job is checking a pin that does not exist"
              status=1
              return
            fi
            ref="${pin%%@*}"
            pinned_version="${ref##*:}"
            latest="$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_API_TOKEN" "https://api.github.com/repos/${gh_repo}/releases/latest" | jq -r .tag_name)"
            latest="${latest#v}"
            if [ -z "$latest" ] || [ "$latest" = "null" ]; then
              echo "::error::Could not determine the latest ${gh_repo} release"
              status=1
            # ORDER, NOT INEQUALITY. `!=` calls any difference "behind", including
            # being ahead, and GitHub's releases/latest is the most recently
            # PUBLISHED release rather than the highest version. A project that
            # ships a maintenance release for an older branch after a newer one
            # then fails every day, asserting a direction nothing established.
            # sort -V because a string compare puts 3.10 below 3.7.
            elif [ "${pinned_version#v}" != "${latest#v}" ] \
                 && [ "$(printf '%s\n%s\n' "${pinned_version#v}" "${latest#v}" | sort -V | head -1)" = "${pinned_version#v}" ]; then
              echo "::error::${var} is behind: pinned ${pinned_version}, latest ${gh_repo} release is ${latest}"
              status=1
            elif [ "${pinned_version#v}" != "${latest#v}" ]; then
              echo "${var} ${pinned_version} is ahead of the published ${latest}, which is what a maintenance release for an older branch looks like"
            else
              echo "${var} ${pinned_version} matches the latest ${gh_repo} release"
            fi
          }
          check CS2_SERVER_IMAGE_TAG joedwards32/CS2
          exit "$status"

  healthcheck:
    name: The health check, in both directions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 tests/e2e-healthcheck.sh

      - name: Prove the exact match catches what a substring match misses
        # Five assertions against a real container, with no CS2 download: two
        # processes named cs2 and cs2.sh are the whole fixture. The game is
        # killed and the exact check must go red while the substring check
        # stays green - if the substring form ever failed too, the comment in
        # the compose file would be wrong and the run says so.
        run: |
          chmod +x tests/e2e-healthcheck.sh
          ./tests/e2e-healthcheck.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f cs2-server-docker-compose.yml config >/dev/null
          echo "compose OK"
