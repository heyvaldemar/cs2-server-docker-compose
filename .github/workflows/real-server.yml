name: Real Server

# THE HEALTH CHECK, PROVEN AGAINST THE REAL GAME. The game is 73 GB and 22
# minutes of SteamCMD on a runner (measured 2026-11-01), too much for every
# push, so this runs when something the check depends on changes, and on a
# timer:
#   - a push or pull request that touches the health check, its stand-in test,
#     the compose file (every image pin lives there), .env.example, or this
#     workflow; so a pin update or a change to the check meets the real
#     server before it is merged;
#   - every Monday at 04:47 UTC;
#   - by hand (workflow_dispatch).
# Every other push runs the check against a stand-in in the pinned image
# (deployment-verification.yml).

on:
  push:
    branches:
      - main
    paths:
      - tools/healthcheck.sh
      - tests/e2e-healthcheck.sh
      - tests/fixtures/fake-a2s.py
      - tests/fixtures/port-owner.sh
      - tests/secret-probe.sh
      - tests/fixtures/sv-password.sh
      - hooks/pre.sh
      - cs2-server-docker-compose.yml
      - .env.example
      - .github/workflows/real-server.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/healthcheck.sh
      - tests/e2e-healthcheck.sh
      - tests/fixtures/fake-a2s.py
      - tests/fixtures/port-owner.sh
      - tests/secret-probe.sh
      - tests/fixtures/sv-password.sh
      - hooks/pre.sh
      - cs2-server-docker-compose.yml
      - .env.example
      - .github/workflows/real-server.yml
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:

concurrency:
  group: real-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  game:
    name: The real server, and the health check asking it
    # Installed the way a first start does, then the health check proven both
    # ways: red while SteamCMD downloads and nothing is bound, green on the
    # server's A2S answer, red with the server stopped by SIGSTOP while the old
    # /proc check stays green, green again after SIGCONT; and across a map
    # change it answers again with Docker healthy throughout.
    # A REAL GAME SERVER TOKEN IS NEEDED. With a placeholder token CS2 no
    # longer logs into Steam and never binds its port: on 2026-11-08 it logged
    # "Cert request for invalid failed ... We're not logged into Steam" for 80
    # minutes on both the ubuntu-26.04 and the ubuntu-24.04 runner (runs
    # 42519498218, 42526820588), where on 2026-11-01 the same placeholder
    # logged in. The token comes from the repository secret
    # CS2_CI_STEAM_TOKEN when it exists; without it this workflow stays red,
    # which is the health check telling the truth about a server nobody can
    # reach.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      COMPOSE: docker compose -f cs2-server-docker-compose.yml -p cs2
      # tests/secret-probe.sh: every secret the compose file passes gets a
      # value of its own (the game server token is kept: Steam must accept it),
      # and none may reach a log, the game's own logs or a command line.
      PROBE_PROJECT: cs2
      PROBE_KEEP: CS2_SERVER_STEAM_TOKEN
      PROBE_EXPECT: CS2_SERVER_STEAM_TOKEN CS2_SERVER_RCON_PASSWORD CS2_SERVER_PASSWORD
      # No game log files: CS2 logs to its console (sv_logfile is off), which is
      # docker compose logs (run 43550550561 found no log file in the install).
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make room for the game
        # About 73 GB of game and 1.2 GB of image; measured: 111 GB free after this.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Docker 29.4.2 answers socketcall with ENOSYS; give its daemon the profile 29.4.3 ships
        # SteamCMD is 32-bit and makes every socket through socketcall(2),
        # which Docker Engine 29.4.2 alone refuses (moby/moby#52506); the
        # ubuntu-26.04 runner ships it. On that version, and only there, the
        # daemon gets the default profile 29.4.3 ships (moby/profiles seccomp
        # v0.2.3), pinned by commit and checksum.
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          if [ "$v" != 29.4.2 ]; then echo "Docker $v: its own profile allows socketcall"; exit 0; fi
          sudo curl -fsSL -o /etc/docker/seccomp-29.4.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /etc/docker/seccomp-29.4.3.json" | sha256sum -c -
          f=/etc/docker/daemon.json
          [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"seccomp-profile": "/etc/docker/seccomp-29.4.3.json"}' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker

      - name: First start - the game is downloaded into the volume
        env:
          STEAM_TOKEN: ${{ secrets.CS2_CI_STEAM_TOKEN }}
        run: |
          cp .env.example .env
          # A placeholder game server token that the repository secret
          # replaces when it exists (see runs-on above).
          sed -i -e "s/^CS2_SERVER_STEAM_TOKEN=$/CS2_SERVER_STEAM_TOKEN=ci-placeholder/" .env
          # The token, when the secret exists, goes into .env through awk's
          # environment, never a command line.
          if [ -n "$STEAM_TOKEN" ]; then
            awk '/^CS2_SERVER_STEAM_TOKEN=/ { print "CS2_SERVER_STEAM_TOKEN=" ENVIRON["STEAM_TOKEN"]; next } { print }' .env > .env.new && mv .env.new .env
            echo "a game server token from the repository secret"
          else
            echo "::warning::no CS2_CI_STEAM_TOKEN secret: a placeholder token, with which CS2 no longer logs into Steam"
          fi
          # A value of its own for the rcon password and the join password
          # (so the server is password-protected), the token kept.
          tests/secret-probe.sh plant
          docker volume create cs2-server-data >/dev/null
          $COMPOSE up -d

      - name: While SteamCMD downloads, nothing is bound and the check is red
        run: |
          cid="$($COMPOSE ps -q cs2-server)"
          sleep 45
          if docker exec "$cid" sh -c "grep -qsx cs2 /proc/[0-9]*/comm"; then
            echo "the game is already running 45 s in; the download stage was too short to sample"
            exit 0
          fi
          n=0; out="$(docker exec "$cid" bash /healthcheck.sh 27015 2>&1)" || n=$?
          echo "45 s in, before the game runs: the check exits $n: $out"
          [ "$n" = 1 ] || { echo "::error::the check was not red before the game ran"; exit 1; }

      - name: Wait for the health check to go green
        run: |
          cid="$($COMPOSE ps -q cs2-server)"
          # 150 minutes, for a slow day: 73 GB took 22 minutes on 2026-11-01 and
          # 20 on 2026-11-09 (run 42544528306). The 80 minutes that once stood
          # here were cs2-classic's, whose fresh volumes could not install at all
          # (root-owned game/ under its mounts); this file mounts nothing there.
          for _ in $(seq 1 900); do
            s="$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
            if [ "$s" = healthy ]; then
              echo "health: $s"; docker exec "$cid" bash /healthcheck.sh 27015
              # The join password, read the moment the server first answers,
              # before anyone could have joined.
              tests/fixtures/sv-password.sh CS2_SERVER_PASSWORD || { echo "::error::the server answers, and its sv_password is not the join password from secrets.cfg"; exit 1; }
              tests/secret-probe.sh check "first start"; exit $?
            fi
            [ "$s" = unhealthy ] && break
            sleep 10
          done
          echo "::error::the server never reported healthy"
          $COMPOSE logs --tail 80
          echo "--- the health check's own words, last runs"
          docker inspect "$cid" --format '{{range .State.Health.Log}}exit {{.ExitCode}}: {{.Output}}{{end}}' | tail -c 2000
          echo "--- UDP sockets in the container (IPv4, then IPv6)"
          docker exec "$cid" cat /proc/net/udp /proc/net/udp6
          exit 1

      - name: The health check answers again after a map change
        # A changelevel silences A2S_INFO while the next map loads. The check
        # must answer again within two minutes, on the new map, and Docker's
        # status (three misses at a 60-second interval) must stay healthy.
        run: |
          cid="$($COMPOSE ps -q cs2-server)"
          docker exec "$cid" bash /healthcheck.sh 27015
          tools/rcon.sh changelevel de_inferno >/dev/null
          t0=$SECONDS; misses=0; ok=""
          while [ $((SECONDS - t0)) -lt 120 ]; do
            if docker exec "$cid" bash /healthcheck.sh 27015 >/dev/null 2>&1; then
              [ $((SECONDS - t0)) -ge 15 ] && { ok=1; break; }
            else
              misses=$((misses + 1))
            fi
            sleep 2
          done
          map="$(tools/rcon.sh status | sed -n 's/.*\(de_[a-z0-9_]*\).*/\1/p' | head -1)"
          s="$(docker inspect "$cid" --format '{{.State.Health.Status}}')"
          echo "after changelevel: map ${map:-?}, $misses missed checks, answering at $((SECONDS - t0))s, docker health: $s"
          [ "$ok" = 1 ] || { echo "::error::the game did not answer again within two minutes of the map change"; exit 1; }
          [ "$map" = de_inferno ] || { echo "::error::the map did not change, so this proved nothing"; exit 1; }
          [ "$s" = healthy ] || { echo "::error::docker called it $s across a map change"; exit 1; }

      - name: The token, the rcon password and the join password work from secrets.cfg
        # None is on the command line any more, so each is proven where it
        # now lives. The token: the server's own SteamID, in its A2S answer, is
        # a persistent game server's (account type 3), which only a game
        # server token gives; anonymous is type 4. The join password: the
        # server's sv_password, read over rcon, is the planted value (compared,
        # never printed); and with no join password set, it is empty, so the
        # server is open as before. Not A2S: CS2 answers "no password" either
        # way, with the image's own +sv_password too (run 43555619039). The
        # rcon password: the map change above went through rcon with it, after
        # server.cfg ran again on the new map; here a wrong one is refused.
        run: |
          python3 - <<'PY'
          import socket, struct, sys
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(3)
          q = b"\xff\xff\xff\xffTSource Engine Query\x00"
          for _ in range(5):
              try:
                  s.sendto(q, ("127.0.0.1", 27015)); d, _ = s.recvfrom(1400)
                  if d[4:5] == b"A":
                      s.sendto(q + d[5:9], ("127.0.0.1", 27015)); d, _ = s.recvfrom(1400)
                  break
              except OSError:
                  continue
          else:
              sys.exit("no A2S answer")
          b = d[6:]; i = 0
          for _ in range(4):
              i = b.index(b"\x00", i) + 1
          i += 2 + 7
          i = b.index(b"\x00", i) + 1
          edf = b[i] if i < len(b) else 0; i += 1
          if edf & 0x80:
              i += 2
          sid = struct.unpack("<Q", b[i:i + 8])[0] if edf & 0x10 else None
          kind = (sid >> 52) & 0xF if sid else None
          print(f"the server's SteamID is account type {kind} (3 is a persistent game server, 4 anonymous)")
          if kind != 3:
              sys.exit("the server did not log into Steam with the game server token from secrets.cfg")
          PY
          tests/fixtures/sv-password.sh CS2_SERVER_PASSWORD || { echo "::error::the server's sv_password is not the join password from secrets.cfg"; exit 1; }
          echo "the join password from secrets.cfg is the server's sv_password"
          # Without a join password, the server is open, as it was: recreated
          # with none, sv_password is empty. Then back to the planted one.
          cp .env "$RUNNER_TEMP/env.real"
          awk -F= '$1 == "CS2_SERVER_PASSWORD" { print $1 "="; next } { print }' "$RUNNER_TEMP/env.real" > .env
          $COMPOSE up -d >/dev/null 2>&1
          cid="$($COMPOSE ps -q cs2-server)"
          for _ in $(seq 1 60); do docker exec "$cid" bash /healthcheck.sh 27015 >/dev/null 2>&1 && break; sleep 5; done
          tests/fixtures/sv-password.sh || { cat "$RUNNER_TEMP/env.real" > .env; echo "::error::with no join password set, the server still has one"; exit 1; }
          echo "with no join password set, sv_password is empty: the server is open"
          cat "$RUNNER_TEMP/env.real" > .env
          $COMPOSE up -d >/dev/null 2>&1
          cid="$($COMPOSE ps -q cs2-server)"
          for _ in $(seq 1 60); do docker exec "$cid" bash /healthcheck.sh 27015 >/dev/null 2>&1 && break; sleep 5; done
          tests/fixtures/sv-password.sh CS2_SERVER_PASSWORD || { echo "::error::back with the join password, the server's sv_password is not it"; exit 1; }
          # A wrong rcon password is refused.
          awk -F= '$1 == "CS2_SERVER_RCON_PASSWORD" { print $1 "=wrong" substr($2, 1, 4); next } { print }' "$RUNNER_TEMP/env.real" > .env
          rc=0; out="$(tools/rcon.sh status 2>&1)" || rc=$?
          cat "$RUNNER_TEMP/env.real" > .env; rm -f "$RUNNER_TEMP/env.real"
          echo "rcon with a wrong password: exit $rc: $out" | head -3
          if [ "$rc" = 0 ] || ! grep -q "refused" <<<"$out"; then
            echo "::error::a wrong rcon password was not refused, so no password was set"; exit 1
          fi

      - name: After a restart - secrets.cfg is written again, and the probe looks once more
        run: |
          cid="$($COMPOSE ps -q cs2-server)"
          $COMPOSE restart cs2-server >/dev/null
          for _ in $(seq 1 60); do
            [ "$(docker inspect "$cid" --format '{{.State.Health.Status}}')" = healthy ] && docker exec "$cid" bash /healthcheck.sh 27015 >/dev/null 2>&1 && break
            sleep 10
          done
          docker exec "$cid" bash /healthcheck.sh 27015
          echo "secrets.cfg: $(docker exec "$cid" stat -c '%U %a' /home/steam/cs2-dedicated/game/csgo/cfg/secrets.cfg), server.cfg runs it: $(docker exec "$cid" grep -c '^exec secrets.cfg' /home/steam/cs2-dedicated/game/csgo/cfg/server.cfg)"
          tests/secret-probe.sh check "after a restart"

      - name: Plant - the process that answers, stopped, keeps the old check green and turns this one red
        # The check up to v1.3.3 was cs2 in /proc. SIGSTOP on the process that
        # owns the port's UDP socket (tests/fixtures/port-owner.sh; a name match
        # is not enough, LinuxGSM's tmux carries the game's name and stopping it
        # stops nothing that answers) leaves every process there and nothing
        # answering: the old check must still pass and this one fail; after
        # SIGCONT this one passes again.
        run: |
          cid="$($COMPOSE ps -q cs2-server)"
          # The owners are visible only to their own user; try every uid here.
          uids="$(docker exec "$cid" sh -c 'cat /proc/[0-9]*/status 2>/dev/null' | awk '/^Uid:/ { print $2 }' | sort -u)"
          own=""; as=""
          for u in $uids; do
            own="$(docker exec -u "$u" -i "$cid" sh -s 27015 < tests/fixtures/port-owner.sh 2>/dev/null)" && { as="$u"; break; }
          done
          [ -n "$own" ] || { echo "::error::no user in the container can see who owns UDP 27015"; docker exec "$cid" cat /proc/net/udp; exit 1; }
          echo "UDP 27015 is owned by (pid uid comm), as seen by uid $as:"; echo "$own"
          pids="$(awk '{ print $1 }' <<<"$own" | tr '\n' ' ')"
          docker exec -u "$as" "$cid" sh -c "kill -STOP $pids"
          st="$(docker exec "$cid" sh -c "for p in $pids; do cut -d' ' -f3 /proc/\$p/stat; done" | tr '\n' ' ')"
          o=0; docker exec "$cid" sh -c "grep -qsx cs2 /proc/[0-9]*/comm" || o=$?
          n=0; out="$(docker exec "$cid" bash /healthcheck.sh 27015 2>&1)" || n=$?
          docker exec -u "$as" "$cid" sh -c "kill -CONT $pids"
          echo "owners stopped (states: $st): the old check exits $o, the new one $n: $out"
          [ "$o" = 0 ] && [ "$n" = 1 ] || { echo "::error::expected the old check to pass (0) and the new one to fail (1)"; exit 1; }
          for _ in $(seq 1 30); do
            docker exec "$cid" bash /healthcheck.sh 27015 && exit 0
            sleep 2
          done
          echo "::error::the game did not answer again after SIGCONT"; exit 1

      - name: The probe sees what it looks for - a canary in a log and on two command lines
        run: tests/secret-probe.sh selftest

      - name: Stop
        if: always()
        run: |
          $COMPOSE down -t 60 >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/secret-probe.values" "$RUNNER_TEMP/env.real" .env
          docker volume rm -f cs2-server-data >/dev/null 2>&1 || true
