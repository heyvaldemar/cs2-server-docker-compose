# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. Set CS2_SERVER_IMAGE_VERSION in .env to run a different version
# while the digest for it is fetched normally, or CS2_SERVER_IMAGE_TAG to
# replace the whole reference. CI (the Trivy scan and check-pin-freshness)
# reads the pin from this line: this block is the single source of truth.
x-images:
  cs2-server: &cs2-server-image ${CS2_SERVER_IMAGE_TAG:-joedwards32/cs2:${CS2_SERVER_IMAGE_VERSION:-5.0.1@sha256:ae10b1aa8734498bb6f88d1cc803a88a9dbbb7d19fd37450747432ccc3a41653}}

# THE USER THE IMAGE RUNS AS, and so the owner of every file in the volume.
# A volume does not follow when an image moves its user, and joedwards32/cs2
# moved it twice in eight days in September 2026 (1000 to 999 and back). On
# the machine this template comes from, the first move left the server
# unable to write its logs for a day and a half while every health check
# stayed green. tests/image-user.sh asks the registry what the pinned image
# runs as and fails when it is not this, so a pin refresh that moves the user
# cannot ship as a patch. Compose ignores this key; it is read by that test.
x-image-user: "1000:1000"

services:
  cs2-server:
    image: *cs2-server-image
    # Handles untrusted input from the internet and cannot gain privileges
    # through a setuid binary.
    security_opt:
      - no-new-privileges:true
    # Resource limits as .env-overridable defaults (e.g. CS2_SERVER_MEMORY_LIMIT=8g);
    # the override survives every git pull.
    #
    # 4g is measured, not guessed: a populated server sits around 950 MB and the
    # ceiling is there so a leak here cannot pick a victim elsewhere — with no
    # limit the kernel's OOM killer chooses by size, so the process it kills is
    # rarely the one at fault.
    deploy:
      resources:
        limits:
          memory: ${CS2_SERVER_MEMORY_LIMIT:-4g}
          cpus: "${CS2_SERVER_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${CS2_SERVER_MEMORY_RESERVATION:-1g}
          cpus: "${CS2_SERVER_CPU_RESERVATION:-0.5}"
    ports:
      # Game and query traffic, both UDP, both on the same number.
      #
      # THE NUMBER MUST MATCH INSIDE AND OUT. Steam's server list records the
      # port the server binds, not the one you forwarded. Publish 27016 to a
      # server bound on 27015 and the list hands players an address where a
      # different server answers: the connection succeeds and the handshake
      # fails against the wrong game, and every log line blames the client.
      - "${CS2_SERVER_PORT:-27015}:${CS2_SERVER_PORT:-27015}/udp"
      - "${CS2_SERVER_PORT:-27015}:${CS2_SERVER_PORT:-27015}/tcp"
    environment:
      # NO SECRET ON THE SERVER'S COMMAND LINE. The image puts SRCDS_TOKEN,
      # CS2_RCONPW and CS2_PW on the game's command line (+sv_setsteamaccount,
      # +rcon_password, +sv_password), where every process in the container
      # and `ps` on the host can read them, through an eval that runs a ";" in
      # a password as a command. They go to the image empty (empty, not unset:
      # unset, the image's own default rcon password applies), and the real
      # values under names it does not read, to hooks/pre.sh, which writes them
      # into secrets.cfg; the server executes it at start (CS2_ADDITIONAL_ARGS)
      # and on every map (server.cfg). tests/secret-probe.sh proves no value
      # reaches a log or a command line.
      SRCDS_TOKEN: ""
      CS2_RCONPW: ""
      CS2_PW: ""
      # A Game Server Login Token, from https://steamcommunity.com/dev/managegameservers
      # (app id 730). Without one the server runs but stays off the public list,
      # which looks identical to a broken server from a player's side.
      CS2T_STEAM_TOKEN: ${CS2_SERVER_STEAM_TOKEN:?set in .env - see .env.example}
      CS2T_RCON_PASSWORD: ${CS2_SERVER_RCON_PASSWORD:?set in .env - see .env.example for generation command}
      CS2T_SERVER_PASSWORD: ${CS2_SERVER_PASSWORD:-}
      CS2_ADDITIONAL_ARGS: "+exec secrets.cfg"
      # Dropped weapons cleared: more than this many on the map, or older
      # than this many seconds (hooks/pre.sh writes both into server.cfg).
      # 0 keeps them all until the map changes, and a server with only bots
      # on it then runs out of networkable entities and crashes.
      CS2T_WEAPON_MAX_BEFORE_CLEANUP: ${CS2_SERVER_WEAPON_MAX_BEFORE_CLEANUP:-64}
      CS2T_WEAPON_AUTO_CLEANUP_TIME: ${CS2_SERVER_WEAPON_AUTO_CLEANUP_TIME:-120}
      CS2_SERVERNAME: ${CS2_SERVER_NAME:-CS2 Dedicated Server}
      CS2_PORT: ${CS2_SERVER_PORT:-27015}
      CS2_MAXPLAYERS: ${CS2_SERVER_MAX_PLAYERS:-10}
      CS2_GAMEALIAS: ${CS2_SERVER_GAME_ALIAS:-competitive}
      CS2_MAPGROUP: ${CS2_SERVER_MAP_GROUP:-mg_active}
      CS2_STARTMAP: ${CS2_SERVER_START_MAP:-de_dust2}
      CS2_BOT_QUOTA: ${CS2_SERVER_BOT_QUOTA:-0}
      CS2_BOT_QUOTA_MODE: ${CS2_SERVER_BOT_QUOTA_MODE:-fill}
      CS2_BOT_DIFFICULTY: ${CS2_SERVER_BOT_DIFFICULTY:-1}
      CS2_LOG: ${CS2_SERVER_LOG:-on}
      CS2_LOG_ECHO: ${CS2_SERVER_LOG_ECHO:-1}
      # NO CS2_RCON_PORT. The image starts `socat TCP-LISTEN:$CS2_RCON_PORT
      # -> 127.0.0.1:$CS2_PORT` before the game whenever it is set; it is meant
      # for a second port. Up to v1.3 this file set it to the game port itself,
      # so socat took TCP 27015 first and forwarded it to itself, the game
      # never got its rcon socket, and every rcon connection was closed
      # unanswered: measured on a real CS2 in CI on 2026-11-01. Unset, the game
      # serves rcon on the game port's TCP side, which is published below.
      # tests/rcon.sh fails if it comes back.
      # Added upstream in 5.0.0. Both carry the image's own defaults, so the
      # server behaves identically whether or not these are set — they are
      # here because a knob nobody can find is a knob that does not exist.
      # How strictly the server enforces its delta-tick budget; 2 is upstream's
      # default and the value a competitive server wants.
      CS2_SERVER_DELTATICKS_ENFORCE: ${CS2_SERVER_DELTATICKS_ENFORCE:-2}
      # Whether GOTV relays player voice. 1 is upstream's default; set 0 where
      # recording voice would be a privacy question rather than a feature.
      TV_RELAYVOICE: ${CS2_SERVER_TV_RELAYVOICE:-1}
      TZ: ${CS2_SERVER_TIMEZONE:-UTC}
    volumes:
      - cs2-server-data:/home/steam/cs2-dedicated
      # The health check: A2S_INFO to the game port (see healthcheck: below).
      - ./tools/healthcheck.sh:/healthcheck.sh:ro
      # The image's pre-start hook, at the path it sources: the secrets into
      # secrets.cfg (see environment: above). At the volume's root, so Docker
      # creates no directory for it inside the game's tree.
      - ./hooks/pre.sh:/home/steam/cs2-dedicated/pre.sh:ro
    healthcheck:
      # THE GAME'S OWN ANSWER, NOT ITS PROCESS. tools/healthcheck.sh sends
      # A2S_INFO, the query every server browser sends, to the game port and is
      # healthy only on the engine's reply. Up to v1.3.3 this looked for cs2 in
      # /proc, which a hung or stopped game keeps; the real-server workflow
      # stops it with SIGSTOP and requires red. The log is not read either. A
      # map change silences it for seconds; the check tries twice and Docker
      # allows three misses at this interval. Each check ends within 7 seconds.
      # It asks from inside the container: it does not prove the port is
      # published on the host or open in a firewall.
      test: ["CMD", "bash", "/healthcheck.sh", "${CS2_SERVER_PORT:-27015}"]
      interval: 60s
      timeout: 10s
      retries: 3
      # First boot downloads roughly 60 GB of game content through SteamCMD.
      # A short start_period marks the container unhealthy for the whole of it.
      start_period: ${CS2_SERVER_START_PERIOD:-90m}
    # srcds writes its state on the way out. Ten seconds and a SIGKILL is
    # enough to lose the last round and leave the game files mid-write.
    stop_grace_period: ${CS2_SERVER_STOP_GRACE_PERIOD:-30s}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${CS2_SERVER_LOG_MAX_SIZE:-10m}
        max-file: "${CS2_SERVER_LOG_MAX_FILE:-3}"

# DECLARED EXTERNAL SO `docker compose down -v` CANNOT DELETE IT.
#
# This volume holds around 60 GB of game content that SteamCMD downloaded once.
# As a project-managed volume it is one `down -v` away from being gone — and
# `down -v` is the command everybody reaches for when a stack misbehaves. It
# then comes back down the wire, slowly, and on a metered connection it comes
# back twice: once in bytes and once on the bill.
#
# Create it before the first start:  docker volume create cs2-server-data
#
# The cost is that removing it is deliberate rather than accidental, which is
# the entire point.
volumes:
  cs2-server-data:
    name: cs2-server-data
    external: true
